<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#faf8fc" />
    <title>Nahida Zaman Bina</title>
    <link rel="icon" href="/assets/branding/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/assets/branding/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/branding/apple-touch-icon.png" sizes="180x180" />
    <link
      rel="preload"
      href="/assets/fonts/instrument-serif-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles/fonts.css" />

    <script src="/src/scripts/theme.js?v=manual-override-2"></script>
    <script src="/src/scripts/effects.js" defer></script>
    <script src="/src/scripts/translations.js?v=hero-status-3" defer></script>
    <script src="/src/scripts/i18n.js?v=clean-language-urls-2" defer></script>
    <link rel="stylesheet" href="/src/styles/main.css?v=hero-status-4" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header detail-header">
      <div class="container nav-wrap">
        <a class="wordmark" href="/" aria-label="Nahida, home"
          ><img
            class="wordmark-light"
            src="/assets/icons/monogram-n-black.svg"
            alt=""
            width="64"
            height="64"
            decoding="async" /><img
            class="wordmark-dark"
            src="/assets/icons/monogram-n-white.svg"
            alt=""
            width="64"
            height="64"
            decoding="async" /></a
        ><a class="text-link" href="/#work"
          >Selected work
          <span aria-hidden="true"
            ><svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M7 17 17 7M7 7h10v10" /></svg></span
        ></a>
        <div class="header-actions">
          <button
            class="theme-toggle"
            type="button"
            aria-label="Dark mode"
            aria-pressed="false"
            hidden
          >
            <svg
              class="theme-icon theme-icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.7 13A8.7 8.7 0 0 1 11 3.3 8.7 8.7 0 1 0 20.7 13Z" />
            </svg>
            <svg
              class="theme-icon theme-icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"
              />
            </svg>
          </button>
          <div class="language-control" hidden>
            <button
              class="language-toggle"
              type="button"
              aria-label="Change language"
              aria-expanded="false"
              aria-controls="language-options"
              title="Change language"
            >
              <img
                data-language-current
                src="/assets/icons/flag-gb.svg"
                alt=""
                width="28"
                height="28"
              /><span class="sr-only" data-language-name>English</span>
            </button>
            <div
              class="language-options"
              id="language-options"
              role="group"
              aria-label="Choose language"
              hidden
            >
              <button
                class="language-option"
                type="button"
                data-language="en-GB"
                aria-pressed="true"
              >
                <img src="/assets/icons/flag-gb.svg" alt="" width="32" height="32" /><span
                  lang="en-GB"
                  >English</span
                ></button
              ><button
                class="language-option"
                type="button"
                data-language="it"
                aria-pressed="false"
              >
                <img src="/assets/icons/flag-it.svg" alt="" width="32" height="32" /><span lang="it"
                  >Italiano</span
                ></button
              ><button
                class="language-option"
                type="button"
                data-language="fr"
                aria-pressed="false"
              >
                <img src="/assets/icons/flag-fr.svg" alt="" width="32" height="32" /><span lang="fr"
                  >Français</span
                >
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="detail-hero container" id="main">
      <p class="eyebrow">404 / A SMALL DETOUR</p>
      <h1>This story is<br /><em>somewhere else.</em></h1>
      <p class="detail-lead">
        The page you’re looking for may have moved, or the link may be incomplete. There’s still
        plenty to explore.
      </p>
      <div class="detail-actions">
        <a class="button button-primary" href="/"
          >Back to the beginning
          <span aria-hidden="true"
            ><svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M7 17 17 7M7 7h10v10" /></svg></span
        ></a>
      </div>
    </main>
    <footer class="site-footer site-footer-simple container">
      <p class="footer-credit">
        Built with <span class="credit-heart" aria-label="love">♡</span> by my
        <a href="https://zunaaaaayed.github.io" target="_blank" rel="noopener noreferrer"
          >husband<span class="sr-only"> (opens in a new tab)</span></a
        >
      </p>
      <p>
        <a href="https://github.com/naaaaaahida/naaaaaahida.github.io">Source code</a> ·
        <a href="/LICENSE">All rights reserved</a>
      </p>
    </footer>
  </body>
</html>
